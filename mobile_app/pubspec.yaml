name: vehicle_predictive_triage
description: Cross-platform mobile app (Android + iOS) for OBD-II telemetry streaming, failure prediction, and DTC triage.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_blue_plus: ^1.30.0
  provider: ^6.1.1
  http: ^1.2.0
  flutter_secure_storage: ^9.0.0
  fl_chart: ^0.68.0
  geolocator: ^11.0.0
  url_launcher: ^6.2.5
  sqflite: ^2.3.2
  path: ^1.9.0
  intl: ^0.19.0
  shared_preferences: ^2.2.3
  cupertino_icons: ^1.0.6
  pdf: ^3.10.8
  printing: ^5.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
