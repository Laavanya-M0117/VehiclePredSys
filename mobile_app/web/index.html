<!DOCTYPE html>
<html>
<head>
  <!-- Auto-redirect if opened on outdated / unlinked domain -->
  <script>
    if (window.location.hostname === 've-triage.onrender.com') {
      window.location.replace('https://vetri-predictive-triage.onrender.com' + window.location.pathname + window.location.search);
    }
  </script>

  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Vehicle Predictive Triage and Health Monitoring System">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="vehicle_predictive_triage">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>VETRI - Vehicle Predictive Triage</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>

  <!-- VETRI Web Bluetooth & GPS Bridge for Chrome on Android -->
  <div id="vetri-ble-banner" style="position:fixed;bottom:12px;left:50%;transform:translateX(-50%);z-index:99999;display:flex;align-items:center;gap:8px;background:rgba(22,25,34,0.95);border:1px solid #00B894;border-radius:30px;padding:8px 16px;box-shadow:0 8px 32px rgba(0,0,0,0.6);backdrop-filter:blur(8px);font-family:sans-serif;max-width:94vw;box-sizing:border-box;">
    <span id="ble-status-dot" style="width:10px;height:10px;border-radius:50%;background:#FDCB6E;flex-shrink:0;"></span>
    <span id="ble-status-text" style="color:#FFF;font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">ESP32: Disconnected</span>
    <button id="ble-connect-btn" onclick="window.vetriWebBleConnect()" style="background:#00B894;color:#FFF;border:none;border-radius:20px;padding:6px 12px;font-size:11px;font-weight:bold;cursor:pointer;outline:none;white-space:nowrap;">Connect Bike</button>
    <button id="gps-sync-btn" onclick="window.vetriSyncGps()" style="background:#0984E3;color:#FFF;border:none;border-radius:20px;padding:6px 10px;font-size:11px;font-weight:bold;cursor:pointer;outline:none;white-space:nowrap;">📍 Sync Location</button>
  </div>

  <script>
    window.vetriUserLat = 0.0;
    window.vetriUserLng = 0.0;
    window.vetriGpsSpeed = 0.0;
    window.vetriGpsWatchId = null;

    // Direct User-Gesture Triggered GPS Sync (Chrome on Android requires user click/gesture for location popup)
    window.vetriSyncGps = function() {
      if (!navigator.geolocation) {
        alert("Geolocation is not supported by your browser.");
        return;
      }
      const gpsBtn = document.getElementById('gps-sync-btn');
      if (gpsBtn) {
        gpsBtn.innerText = "Locating...";
        gpsBtn.style.background = "#E17055";
      }

      function onPos(pos) {
        window.vetriUserLat = pos.coords.latitude;
        window.vetriUserLng = pos.coords.longitude;
        if (pos.coords.speed !== null && pos.coords.speed >= 0) {
          window.vetriGpsSpeed = Math.round(pos.coords.speed * 3.6 * 10) / 10;
        }
        if (gpsBtn) {
          gpsBtn.innerText = "📍 GPS Locked";
          gpsBtn.style.background = "#2D3436";
        }
        console.log("[VETRI GPS] Locked:", window.vetriUserLat, window.vetriUserLng, "Speed:", window.vetriGpsSpeed);

        const pushTarget = window.location.hostname.includes('ve-triage')
          ? 'https://vetri-predictive-triage.onrender.com/api/telemetry/push'
          : '/api/telemetry/push';
        fetch(pushTarget, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            device_id: 'ESP32-VETRI-OBD',
            raw_packet: 'GPS_LOCK',
            lat: window.vetriUserLat,
            lng: window.vetriUserLng,
            gps_speed: window.vetriGpsSpeed
          })
        }).catch(function() {});
      }

      function onErr(err) {
        console.warn("[VETRI GPS] Error:", err.message);
        if (gpsBtn) {
          gpsBtn.innerText = "📍 Tap for GPS";
          gpsBtn.style.background = "#D63031";
        }
      }

      navigator.geolocation.getCurrentPosition(onPos, onErr, {
        enableHighAccuracy: true,
        timeout: 10000,
        maximumAge: 1000
      });

      if (!window.vetriGpsWatchId) {
        window.vetriGpsWatchId = navigator.geolocation.watchPosition(onPos, onErr, {
          enableHighAccuracy: true,
          maximumAge: 1000
        });
      }
    };

    window.vetriWebBleConnect = async function() {
      // Proactively trigger GPS permission popup within this click user-gesture
      window.vetriSyncGps();

      const btn = document.getElementById('ble-connect-btn');
      const text = document.getElementById('ble-status-text');
      const dot = document.getElementById('ble-status-dot');

      if (!navigator.bluetooth) {
        alert("Web Bluetooth requires Google Chrome on Android or Desktop over HTTPS.\n\nTip: You can also download and install VETRI_Final.apk for native Bluetooth connection.");
        return;
      }

      try {
        btn.innerText = "Pairing...";
        btn.disabled = true;

        const device = await navigator.bluetooth.requestDevice({
          filters: [{ name: 'ESP32-VETRI-OBD' }],
          optionalServices: ['6e400001-b5a3-f393-e0a9-e50e24dcca9e']
        });

        text.innerText = "Connecting GATT...";
        const server = await device.gatt.connect();

        device.addEventListener('gattserverdisconnected', () => {
          text.innerText = "ESP32: Disconnected";
          dot.style.background = "#FF7675";
          btn.innerText = "Reconnect";
          btn.disabled = false;
        });

        const service = await server.getPrimaryService('6e400001-b5a3-f393-e0a9-e50e24dcca9e');
        const txChar = await service.getCharacteristic('6e400003-b5a3-f393-e0a9-e50e24dcca9e');

        let bleBuffer = "";
        let packetCount = 0;
        let lastPushTime = 0;

        await txChar.startNotifications();
        txChar.addEventListener('characteristicvaluechanged', (e) => {
          const chunk = new TextDecoder().decode(e.target.value);
          bleBuffer += chunk;
          while (bleBuffer.includes('\n')) {
            const idx = bleBuffer.indexOf('\n');
            const line = bleBuffer.substring(0, idx).trim();
            bleBuffer = bleBuffer.substring(idx + 1);
            if (line.length > 0 && (line.includes('RPM:') || line.includes('0x7E8') || line.includes('NO_SIGNAL') || line.startsWith('{'))) {
              packetCount++;
              text.innerText = "LIVE (" + packetCount + " pkts)";
              const now = Date.now();
              if (now - lastPushTime >= 150) {
                lastPushTime = now;
                const pushTarget = window.location.hostname.includes('ve-triage')
                  ? 'https://vetri-predictive-triage.onrender.com/api/telemetry/push'
                  : '/api/telemetry/push';
                fetch(pushTarget, {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({
                    device_id: 'ESP32-VETRI-OBD',
                    raw_packet: line,
                    lat: window.vetriUserLat || 0.0,
                    lng: window.vetriUserLng || 0.0,
                    gps_speed: window.vetriGpsSpeed || 0.0
                  })
                }).catch(() => {});
              }
            }
          }
        });

        text.innerText = "LIVE (Streaming)";
        dot.style.background = "#00B894";
        btn.innerText = "Connected";
        btn.style.background = "#2D3436";
        btn.disabled = true;
      } catch (err) {
        console.error("BLE Connect Error:", err);
        text.innerText = "Pairing Cancelled";
        dot.style.background = "#FF7675";
        btn.innerText = "Retry Connect";
        btn.disabled = false;
      }
    };
  </script>
</body>
</html>
